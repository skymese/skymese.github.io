  .icon-btn{

  .kbd{

  .tab{

  .rank-ico img{width:26px;height:26px;object-fit:contain;display:block;border-radius:6px}
  .card-name{font-size:15.5px;font-weight:680;line-height:1.3;margin:1px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .hot{font-size:11px}
  .arrow{margin-left:auto;color:var(--faint);font-size:15px;transition:transform .16s,color .16s;flex:none}
  .card:hover .arrow{transform:translate(2px,-2px);color:var(--c,var(--accent))}
  .card-desc{font-size:12.8px;color:var(--muted);margin:0 0 13px;flex:1;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:10.5px;color:var(--faint);border:1px solid var(--line-soft);border-radius:5px;padding:2px 7px;font-family:var(--mono)}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}

  .rank-arrow{color:var(--muted)}

const state = { tab:'tools', cat:'all', q:'' };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderCats(){
  const g = DATA[state.tab];
  $('cats').innerHTML = Object.entries(g.cats).map(([k,v]) =>
    `<button class="chip ${k===state.cat?'active':''}" data-cat="${k}">${v}</button>`).join('');
  $('cats').querySelectorAll('.chip').forEach(btn => btn.onclick = () => { state.cat = btn.dataset.cat; renderCats(); renderGrid(); });
}

function renderGrid(){
  const g = DATA[state.tab];
  const q = state.q.trim().toLowerCase();
  const list = g.items.filter(it => (state.cat==='all' || it[4]===state.cat) &&
    (!q || (it[0]+it[2]+it[5]).toLowerCase().includes(q)));
  $('sectionTitle').textContent = state.cat==='all' ? (state.tab==='tools'?'全部 AI 工具':'全部开源项目') : g.cats[state.cat];
  $('resultHint').textContent = `显示 ${list.length} 项`;
  $('grid').innerHTML = list.length ? list.map(it => {
    const [name,emoji,desc,url,cat,tags,hot,iconPath] = it;
    const color = g.colors[cat] || 'var(--accent)';
    const icoHtml = iconPath
      ? `<img src="${esc(iconPath)}" alt="" loading="lazy" onerror="this.style.display='none';this.parentNode.textContent='${emoji}'">`
      : emoji;
    return `<a class="card" href="${esc(url)}" target="_blank" rel="noopener" style="--c:${color}">
      <div class="card-top">
        <div class="ico">${icoHtml}</div>
        <div class="card-name">${esc(name)}${hot?'<span class="hot" title="热门">🔥</span>':''}</div>
        <span class="arrow">↗</span>
      </div>
      <p class="card-desc">${esc(desc)}</p>
      <div class="tags">${tags.split('|').filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </a>`;
  }).join('') : `<div class="empty"><div class="big">🔍</div><div>没有找到匹配的项目，换个关键词试试</div></div>`;
}

function switchTab(tab){
  state.tab = tab; state.cat = 'all';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
  renderCats(); renderGrid();
}

let timer;
$('search').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(()=>{ state.q = e.target.value; renderGrid(); }, 80); });

  if (e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); $('search').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('search')){ $('search').value=''; state.q=''; renderGrid(); $('search').blur(); }
});

  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
};

// ============ 热度排行榜 ============
const VISIT_KEY = 'aitools_visits_v1';

function loadStorage(key, def){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch(e){ return def; }
}
function saveStorage(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

// 合并所有数据源
function getMergedItems(){
  return [...DATA.tools.items, ...DATA.oss.items];
}

// 访问计数（点击时调用）
function recordVisit(url){
  const counts = loadStorage(VISIT_KEY, {});
  counts[url] = (counts[url] || 0) + 1;
  saveStorage(VISIT_KEY, counts);
}

// 热度分数计算：hot标记基础分 + 访问次数
function getScore(item){
  const visits = loadStorage(VISIT_KEY, {});
  const base = item[6] ? 100 : 0; // hot flag
  const v = visits[item[3]] || 0;
  return base + v;
}

// 渲染热度榜
function renderHotRank(){
  const items = getMergedItems();
  const ranked = items.map(it => ({item:it, score:getScore(it)}))
    .sort((a,b)=> b.score - a.score)
    .slice(0, 20);
  const html = ranked.map((r,i) => {
    const [name,emoji,desc,url,cat,tags,,iconPath] = r.item;
    const icoHtml = iconPath
      ? `<img src="${esc(iconPath)}" alt="" loading="lazy" onerror="this.style.display='none';this.parentNode.textContent='${emoji}'">`
      : emoji;
    return `<a class="rank-item" href="${esc(url)}" target="_blank" rel="noopener" data-url="${esc(url)}">
      <div class="rank-num">${i+1}</div>
      <div class="rank-ico">${icoHtml}</div>
      <div class="rank-info">
        <div class="rank-name">${esc(name)}</div>
        <div class="rank-desc">${esc(desc)}</div>
      </div>
      <div class="rank-score">🔥 ${r.score}</div>
      <div class="rank-arrow">↗</div>
    </a>`;
  }).join('');
  $('grid').innerHTML = `<div class="rank-list">${html || '<div class="empty">暂无数据</div>'}</div>`;
  $('cats').innerHTML = '';
  $('sectionTitle').textContent = '🔥 热度排行榜 Top 20';
  $('resultHint').textContent = `共 ${items.length} 项 · 基于访问热度与标记排序`;

  // 绑定点击计数
  document.querySelectorAll('.rank-item').forEach(el=>{
    el.addEventListener('click', ()=> recordVisit(el.dataset.url));
  });
}

// 重写 switchTab 以支持热度榜
const _origSwitch = switchTab;
switchTab = function(tab){
  state.tab = tab; state.cat = 'all';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
  if(tab==='hot'){ renderHotRank(); }
  else{ renderCats(); renderGrid(); }
};

// 绑定卡片点击计数（原有 grid 卡片）
const _origRenderGrid = renderGrid;
renderGrid = function(){
  _origRenderGrid();
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=> recordVisit(el.href));
  });
};

// 初始化统计（包含自动收录）
const _all = getMergedItems();
$('tabCountTools').textContent = DATA.tools.items.length;
$('tabCountOss').textContent = DATA.oss.items.length;
$('tabCountHot').textContent = 'Top 20';

</script>
