<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 · 页面不存在</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{--bg:#0a0b0d;--line:#252a36;--text:#eef1f7;--muted:#8b93a7;--accent:#6ee7b7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;text-align:center;padding:24px}
  .box{max-width:460px}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:76px;font-weight:700;letter-spacing:-.04em;
    line-height:1;color:var(--accent);margin:0 0 16px}
  h1{font-size:21px;margin:0 0 10px;font-weight:640}
  p{color:var(--muted);font-size:14px;margin:0 0 28px;line-height:1.7}
  a{display:inline-block;padding:10px 18px;border:1px solid var(--line);border-radius:10px;color:var(--text);
    text-decoration:none;font-size:14px;transition:border-color .15s}
  a:hover{border-color:var(--accent)}
  .foot{margin-top:36px;font-family:ui-monospace,monospace;font-size:11px;color:#5b6274;letter-spacing:.08em}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这里什么都没有</h1>
    <p>你访问的路径不存在，或者内容已被移动。<br />返回首页继续浏览。</p>
    <a href="/">← 返回首页</a>
    <div class="foot">GITHUB PAGES · STATIC SITE</div>
  </div>
</body>
</html>
